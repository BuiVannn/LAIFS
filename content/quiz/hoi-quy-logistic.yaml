trang_thai: da_duyet
nguoi_duyet: "ra-soat-tu-dong 2026-09-18"
cau_hoi:
  - id: q1
    loai: mot
    do_kho: 1
    de: "Dù tên có chữ 'hồi quy', hồi quy logistic dùng cho loại bài toán nào?"
    lua_chon:
      - Phân loại — đầu ra là xác suất của một lớp
      - Dự báo một giá trị liên tục như giá nhà
      - Gom cụm dữ liệu không nhãn
      - Giảm số chiều của dữ liệu
    dap_an: 0
    giai_thich: "Tên gọi là di sản lịch sử: phần lõi w·x + b đúng là tuyến tính, nhưng sigmoid biến nó thành xác suất và mục tiêu là phân loại. Dự báo giá nhà là việc của hồi quy tuyến tính."

  - id: q2
    loai: so
    do_kho: 1
    de: "Mô hình có w = 0.8, b = −2. Với x = 4, xác suất dự đoán ŷ = σ(w·x + b) bằng bao nhiêu? (làm tròn 4 chữ số thập phân)"
    dap_an: 0.7685
    sai_so: 0.0005
    giai_thich: "z = 0.8 × 4 − 2 = 1.2. σ(1.2) = 1/(1 + e^(−1.2)) = 1/(1 + 0.3012) = 0.7685."

  - id: q3
    loai: so
    do_kho: 2
    de: "Mô hình gán xác suất p = 0.8 cho một mẫu. Log-odds (logit) của mẫu đó bằng bao nhiêu? (4 chữ số thập phân)"
    dap_an: 1.3863
    sai_so: 0.0005
    giai_thich: "odds = 0.8/0.2 = 4. log-odds = ln(4) = 1.3863. Đây chính là giá trị z = w·x + b của mẫu, vì mô hình tuyến tính theo log-odds."

  - id: q4
    loai: mot
    do_kho: 2
    de: Vì sao KHÔNG nên dùng MSE làm hàm mất mát cho hồi quy logistic?
    lua_chon:
      - MSE không tính được đạo hàm khi có sigmoid
      - "Mặt lỗi khi đó không lồi, và gradient chứa thừa số ŷ(1 − ŷ) nên teo về 0 đúng lúc mô hình sai nặng nhất"
      - MSE luôn cho loss âm nên không tối thiểu hoá được
      - MSE chỉ dùng được khi có đúng 2 đặc trưng
    dap_an: 1
    giai_thich: "Hai vấn đề độc lập. (1) (σ(wx+b) − y)² có vùng lõm nên mất đảm bảo hội tụ về cực tiểu toàn cục. (2) Với y = 1, z = −6: gradient MSE theo z là −0.0049 còn cross-entropy là −0.9975, chênh hơn 200 lần — MSE gần như không sửa mẫu sai nặng."

  - id: q5
    loai: so
    do_kho: 2
    de: "Một mẫu có x = 3, y = 1. Mô hình đang ở w = 0, b = 0. Giá trị ∂L/∂w = (ŷ − y)·x của riêng mẫu này bằng bao nhiêu? (L là cross-entropy nhị phân)"
    dap_an: -1.5
    sai_so: 0.001
    giai_thich: "z = 0 nên ŷ = σ(0) = 0.5. (ŷ − y)·x = (0.5 − 1) × 3 = −1.5. Gradient âm nên bước cập nhật w ← w − η·(−1.5) sẽ TĂNG w, đúng ý: mẫu này cần xác suất cao hơn."

  - id: q6
    loai: mot
    do_kho: 1
    de: "Với ngưỡng quyết định mặc định 0.5, mô hình dự đoán lớp 1 khi nào?"
    lua_chon:
      - Khi w·x + b ≥ 0
      - Khi w·x + b ≥ 0.5
      - Khi w·x + b ≥ 1
      - Không xác định được nếu chưa biết w
    dap_an: 0
    giai_thich: "σ(z) ≥ 0.5 tương đương z ≥ 0, vì σ(0) = 0.5 và σ tăng nghiêm ngặt. Vậy biên quyết định là siêu phẳng w·x + b = 0 — hồi quy logistic luôn cho biên tuyến tính."

  - id: q7
    loai: nhieu
    do_kho: 2
    de: Những phát biểu nào về hàm sigmoid σ(z) = 1/(1 + e^(−z)) là ĐÚNG? (chọn tất cả ý đúng)
    lua_chon:
      - Giá trị luôn nằm trong khoảng (0, 1), không bao giờ đạt đúng 0 hay 1
      - σ′(z) = σ(z)(1 − σ(z)), đạt cực đại 0.25 tại z = 0
      - "σ(−z) = 1 − σ(z)"
      - Khi |z| lớn thì đạo hàm tiến về 0, nên tín hiệu học gần như tắt
      - Sigmoid làm biên quyết định trở thành đường cong phi tuyến trong không gian đặc trưng
    dap_an: [0, 1, 2, 3]
    giai_thich: "Bốn ý đầu đúng. Ý cuối sai: sigmoid chỉ đổi đơn vị đầu ra, biên vẫn là siêu phẳng w·x + b = 0. Muốn biên cong thì phải thêm đặc trưng phi tuyến hoặc dùng mạng nhiều lớp."

  - id: q8
    loai: so
    do_kho: 2
    de: "Một mẫu có odds = 3 (khả năng thuộc lớp 1 gấp 3 lần khả năng không). Xác suất p bằng bao nhiêu?"
    dap_an: 0.75
    sai_so: 0.001
    giai_thich: "p = odds/(1 + odds) = 3/4 = 0.75. Đảo lại: odds = p/(1 − p) = 0.75/0.25 = 3. Hai cách viết cùng một thông tin."

  - id: q9
    loai: mot
    do_kho: 2
    de: "Mô hình có hệ số w = 0.8 cho đặc trưng 'số giờ ôn bài'. Học thêm 1 giờ làm điều gì thay đổi?"
    lua_chon:
      - Xác suất đỗ tăng thêm đúng 0.8
      - Xác suất đỗ được nhân với 0.8
      - "Log-odds cộng thêm 0.8, tức odds được nhân với e^0.8 ≈ 2.23"
      - Không đổi gì nếu chưa biết b
    dap_an: 2
    giai_thich: "Mô hình tuyến tính theo log-odds, nên w cộng vào log-odds. Odds nhân e^0.8 ≈ 2.2255 bất kể xuất phát ở đâu. Xác suất thì tăng không đều: từ 0.5 lên 0.6900 (tăng 0.19) nhưng từ 0.95 chỉ lên 0.9769 (tăng 0.027)."

  - id: q10
    loai: mot
    do_kho: 3
    de: "Sàng lọc một bệnh hiếm nhưng nguy hiểm: bỏ sót một ca bệnh tốn kém hơn nhiều so với báo động nhầm. Mô hình đã huấn luyện xong. Nên làm gì?"
    lua_chon:
      - Huấn luyện lại với learning rate lớn hơn
      - Hạ ngưỡng quyết định xuống dưới 0.5 (ví dụ 0.2) để bắt được nhiều ca dương hơn
      - Nâng ngưỡng lên 0.9 để chắc chắn hơn
      - Đổi sang MSE để mô hình nhạy hơn
    dap_an: 1
    giai_thich: "Ngưỡng là tham số lúc dùng, không phải lúc học: đổi ngưỡng KHÔNG cần huấn luyện lại. Hạ ngưỡng làm tăng recall (bắt được nhiều ca bệnh hơn), đổi lại nhiều báo động nhầm hơn — đúng với bài toán mà bỏ sót đắt hơn."

  - id: q11
    loai: mot
    do_kho: 3
    de: "Đạo hàm của cross-entropy nhị phân theo z rút gọn thành đúng (ŷ − y). Đạo hàm của sigmoid biến đi đâu?"
    lua_chon:
      - Nó bị bỏ qua để công thức cho gọn, đây là một phép xấp xỉ
      - "σ′(z) = ŷ(1 − ŷ) triệt tiêu với mẫu số ŷ(1 − ŷ) mà cross-entropy sinh ra ở ∂L/∂ŷ"
      - Nó bằng 1 với mọi z
      - Nó được gộp vào learning rate
    dap_an: 1
    giai_thich: "∂L/∂ŷ = (ŷ − y)/[ŷ(1 − ŷ)] và ∂ŷ/∂z = ŷ(1 − ŷ). Nhân hai cái lại, thừa số triệt tiêu CHÍNH XÁC, không hề xấp xỉ. Đây là lý do cross-entropy được gọi là hàm mất mát 'khớp' với sigmoid: nó vô hiệu hoá đúng cái thừa số gây bão hoà."

  - id: q12
    loai: mot
    do_kho: 3
    de: "Dữ liệu tách được hoàn hảo bằng một đường thẳng. Huấn luyện hồi quy logistic không regularization, sau 5000 epoch thấy |w| lên tới hàng nghìn và vẫn tăng. Chuyện gì đang xảy ra?"
    lua_chon:
      - Learning rate quá lớn, mô hình đang phân kỳ
      - Dữ liệu bị lỗi, cần kiểm tra lại nhãn
      - "Bài toán không có cực tiểu hữu hạn: nhân đôi w luôn làm loss giảm thêm, nên |w| tăng mãi và loss tiệm cận 0"
      - Mô hình đã hội tụ, con số lớn là bình thường
    dap_an: 2
    giai_thich: "Khi tách được hoàn hảo, mọi mẫu đều đúng phía biên, nên phóng to w chỉ đẩy các xác suất sát 0 và 1 hơn, loss luôn giảm thêm chút ít. Không có điểm dừng. Cách chữa là thêm phạt λ‖w‖² (regularization) hoặc dừng sớm."
