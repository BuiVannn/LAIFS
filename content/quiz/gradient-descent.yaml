trang_thai: nhap
cau_hoi:
  - loai: mot
    do_kho: 1
    de: Gradient descent dùng để làm gì trong huấn luyện mô hình?
    lua_chon:
      - Tìm bộ tham số làm hàm mất mát nhỏ nhất
      - Tìm bộ tham số làm hàm mất mát lớn nhất
      - Chia dữ liệu thành tập train và test
      - Tính đạo hàm của hàm mất mát một cách chính xác
    dap_an: 0
    giai_thich: Mục tiêu là tối thiểu hoá hàm mất mát. Việc tính đạo hàm chỉ là một bước bên trong thuật toán, không phải mục đích.

  - loai: mot
    do_kho: 1
    de: "Tại điểm hiện tại, đạo hàm L′(w) = 4 (dương). Bước cập nhật tiếp theo sẽ làm w thay đổi thế nào?"
    lua_chon:
      - w tăng
      - w giảm
      - w giữ nguyên
      - Không xác định được nếu không biết learning rate
    dap_an: 1
    giai_thich: "w ← w − η·L′(w). Với η > 0 và L′(w) > 0 thì ta trừ đi một số dương, nên w giảm. Độ lớn của bước phụ thuộc η, nhưng chiều thì không."

  - loai: so
    do_kho: 1
    de: "L(w) = w², learning rate η = 0.1, đang ở w = 3. Sau MỘT bước gradient descent, w bằng bao nhiêu?"
    dap_an: 2.4
    sai_so: 0.001
    giai_thich: "L′(w) = 2w = 6. w mới = 3 − 0.1 × 6 = 2.4."

  - loai: so
    do_kho: 2
    de: "L(w) = (w − 1)², η = 0.25, xuất phát từ w = 5. Sau HAI bước, w bằng bao nhiêu?"
    dap_an: 2
    sai_so: 0.001
    giai_thich: "L′(w) = 2(w − 1). Bước 1: L′(5) = 8, w = 5 − 0.25 × 8 = 3. Bước 2: L′(3) = 4, w = 3 − 0.25 × 4 = 2."

  - loai: mot
    do_kho: 2
    de: "Với L(w) = w², chọn learning rate η = 1.0 và xuất phát từ w = 2.5. Điều gì xảy ra?"
    lua_chon:
      - Hội tụ về 0 rất nhanh
      - Nhảy qua lại mãi giữa 2.5 và −2.5
      - Phân kỳ, |w| tăng dần ra vô cùng
      - Đứng yên tại 2.5
    dap_an: 1
    giai_thich: "w ← w − 1.0 × 2w = −w. Mỗi bước chỉ đổi dấu w, nên dao động mãi giữa 2.5 và −2.5. Thử trong phần trực quan hoá để thấy."

  - loai: nhieu
    do_kho: 2
    de: Những dấu hiệu nào cho thấy learning rate có thể đang QUÁ LỚN? (chọn tất cả ý đúng)
    lua_chon:
      - Loss tăng dần hoặc tăng vọt lên rất lớn
      - Loss nhảy lên xuống thất thường thay vì giảm đều
      - Loss giảm đều nhưng cực kỳ chậm
      - Tham số trở thành NaN hoặc vô cùng
    dap_an: [0, 1, 3]
    giai_thich: "Bước quá dài làm nhảy qua đáy (dao động) hoặc văng ra xa (phân kỳ, tràn số thành NaN/inf). Loss giảm đều mà chậm là dấu hiệu learning rate quá NHỎ."

  - loai: mot
    do_kho: 2
    de: "Learning rate giữ cố định. Vì sao các bước đi của gradient descent vẫn ngắn dần khi đến gần đáy?"
    lua_chon:
      - Vì thuật toán tự giảm learning rate
      - Vì độ dốc (đạo hàm) nhỏ dần khi gần đáy, mà bước đi tỉ lệ với độ dốc
      - Vì loss đã bằng 0
      - Vì số bước đã chạy tăng lên
    dap_an: 1
    giai_thich: "Độ dài bước = η × |L′(w)|. Gần đáy hàm mượt thì mặt phẳng dần, |L′(w)| nhỏ đi, nên bước cũng ngắn lại dù η không đổi."

  - loai: mot
    do_kho: 2
    de: "Hàm mất mát có hai đáy: một đáy nông và một đáy sâu hơn. Gradient descent sẽ dừng ở đâu?"
    lua_chon:
      - Luôn ở đáy sâu hơn (cực tiểu toàn cục)
      - Luôn ở đáy nông hơn
      - Tuỳ điểm xuất phát (và learning rate), có thể kẹt ở đáy nông
      - Không dừng được vì hàm có hai đáy
    dap_an: 2
    giai_thich: "Gradient descent chỉ nhìn độ dốc tại chỗ, không nhìn được toàn bộ hàm. Xuất phát gần đáy nào thì thường rơi vào đáy đó. Đây là lý do gọi là cực tiểu cục bộ."

  - loai: mot
    do_kho: 1
    de: Gradient ∇L của một hàm nhiều biến chỉ hướng nào?
    lua_chon:
      - Hướng loss tăng nhanh nhất
      - Hướng loss giảm nhanh nhất
      - Hướng về gốc toạ độ
      - Hướng về cực tiểu toàn cục
    dap_an: 0
    giai_thich: "Gradient chỉ hướng dốc LÊN nhanh nhất. Vì vậy công thức cập nhật dùng dấu trừ: w ← w − η∇L, để đi theo hướng ngược lại."

  - loai: so
    do_kho: 3
    de: "Hồi quy tuyến tính ŷ = wx + b với loss MSE, dữ liệu chỉ có 1 điểm (x = 2, y = 5). Đang ở w = 1, b = 0, η = 0.1. Sau một bước, w bằng bao nhiêu?"
    dap_an: 2.2
    sai_so: 0.001
    giai_thich: "L = (wx + b − y)². Sai số = 1×2 + 0 − 5 = −3. ∂L/∂w = 2 × (−3) × x = −12. w mới = 1 − 0.1 × (−12) = 2.2."
