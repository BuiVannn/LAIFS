trang_thai: nhap
cau_hoi:
  - id: q1
    loai: mot
    do_kho: 1
    de: "Vì sao không dùng TỔNG các sai số (yᵢ − ŷᵢ) làm hàm mất mát?"
    lua_chon:
      - Vì tổng quá lớn, máy tính không lưu được
      - Vì sai số dương và âm triệt tiêu nhau, mô hình sai nhiều vẫn có thể cho tổng bằng 0
      - Vì tổng sai số luôn âm
      - Vì không tính được đạo hàm của phép cộng
    dap_an: 1
    giai_thich: "Lệch +2 và −2 cộng lại bằng 0, trông như đoán đúng hoàn toàn. Bình phương hoặc trị tuyệt đối biến mọi sai số thành không âm nên không còn triệt tiêu."

  - id: q2
    loai: so
    do_kho: 1
    de: "Giá trị thật y = [1, 2, 3], mô hình dự đoán ŷ = [2, 2, 1]. MSE bằng bao nhiêu? (làm tròn 2 chữ số thập phân)"
    dap_an: 1.67
    sai_so: 0.01
    giai_thich: "Sai số y − ŷ = [−1, 0, 2]. Bình phương: [1, 0, 4], tổng 5. MSE = 5 / 3 ≈ 1.67."

  - id: q3
    loai: so
    do_kho: 1
    de: "Cùng dữ liệu: y = [1, 2, 3], ŷ = [2, 2, 1]. MAE bằng bao nhiêu?"
    dap_an: 1
    sai_so: 0.001
    giai_thich: "Trị tuyệt đối sai số: [1, 0, 2], tổng 3. MAE = 3 / 3 = 1."

  - id: q4
    loai: so
    do_kho: 2
    de: "Sai số của 4 dự đoán là [3, −3, 3, −3]. RMSE (căn bậc hai của MSE) bằng bao nhiêu?"
    dap_an: 3
    sai_so: 0.001
    giai_thich: "Bình phương mỗi sai số đều bằng 9, nên MSE = 9. RMSE = √9 = 3, cùng đơn vị với y: trung bình mô hình lệch khoảng 3."

  - id: q5
    loai: nhieu
    do_kho: 2
    de: Những phát biểu nào về MSE là ĐÚNG? (chọn tất cả ý đúng)
    lua_chon:
      - MSE luôn lớn hơn hoặc bằng 0
      - MSE bằng 0 khi và chỉ khi mọi dự đoán đều đúng hoàn toàn
      - MSE có cùng đơn vị với y
      - MSE nhạy với điểm ngoại lai hơn MAE
    dap_an: [0, 1, 3]
    giai_thich: "MSE là trung bình các bình phương nên không âm, và chỉ bằng 0 khi mọi sai số bằng 0. Đơn vị của MSE là đơn vị của y bình phương (RMSE mới cùng đơn vị với y). Bình phương làm sai số lớn trội hẳn nên MSE nhạy với ngoại lai hơn."

  - id: q6
    loai: mot
    do_kho: 2
    de: "Dữ liệu có vài điểm bị nhập sai rất nặng mà bạn không muốn chúng chi phối mô hình. Nên ưu tiên loss nào?"
    lua_chon:
      - MSE
      - MAE
      - Tổng sai số (không bình phương, không trị tuyệt đối)
      - Không loss nào khác nhau
    dap_an: 1
    giai_thich: "MAE phạt tuyến tính theo độ lệch, còn MSE phạt theo bình phương. Một điểm lệch 10 đóng góp 10 vào tổng của MAE nhưng tới 100 vào tổng của MSE, nên MAE ít bị ngoại lai kéo hơn."

  - id: q7
    loai: mot
    do_kho: 2
    de: "Nếu MỌI sai số của mô hình đều tăng gấp đôi thì MSE thay đổi thế nào?"
    lua_chon:
      - Không đổi
      - Tăng gấp đôi
      - Tăng gấp bốn
      - Tăng thêm 2 đơn vị
    dap_an: 2
    giai_thich: "(2e)² = 4e². Mỗi số hạng gấp 4 nên trung bình cũng gấp 4. (MAE thì chỉ gấp đôi.)"

  - id: q8
    loai: so
    do_kho: 2
    de: "Mô hình ŷ = wx (không có b), dữ liệu x = [1, 2], y = [2, 4]. Tính loss MSE L(w) tại w = 1."
    dap_an: 2.5
    sai_so: 0.001
    giai_thich: "Dự đoán wx = [1, 2]. Sai số wx − y = [−1, −2], bình phương [1, 4]. L(1) = 5 / 2 = 2.5."

  - id: q9
    loai: so
    do_kho: 3
    de: "Tiếp câu trước (x = [1, 2], y = [2, 4], ŷ = wx). Dùng dL/dw = (2/n)·Σ(wxᵢ − yᵢ)·xᵢ, tính đạo hàm tại w = 1."
    dap_an: -5
    sai_so: 0.001
    giai_thich: "Sai số wx − y = [−1, −2]. Nhân với x: [−1, −4], tổng −5. Với n = 2: dL/dw = (2/2) × (−5) = −5. Đạo hàm âm nên tăng w sẽ giảm loss (đáy ở w = 2)."

  - id: q10
    loai: mot
    do_kho: 1
    de: Trong lúc huấn luyện, hàm mất mát được xem là hàm của cái gì?
    lua_chon:
      - "Của dữ liệu đầu vào x"
      - "Của tham số mô hình (w, b), còn dữ liệu giữ cố định"
      - Của số epoch
      - Của learning rate
    dap_an: 1
    giai_thich: "Dữ liệu huấn luyện không đổi. Thứ ta được phép chỉnh là tham số, nên ta xem L(w, b) và tìm w, b cho L nhỏ nhất."
